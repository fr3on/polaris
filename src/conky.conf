local function saved()
  local f = io.open(os.getenv('HOME') .. '/.config/polaris/position', 'r')
  if not f then return nil end
  local x, y = f:read('*a'):match('(%-?%d+)%s+(%-?%d+)'); f:close()
  return x and tonumber(x), y and tonumber(y)
end
local sx, sy = saved()
local function rate()
  local f = io.open(os.getenv('HOME') .. '/.config/polaris/refresh', 'r')
  local n = f and tonumber(f:read('*l')); if f then f:close() end
  return (n and n >= 1 and n <= 60) and n or 2
end

local function scale()
  local f = io.open(os.getenv('HOME') .. '/.config/polaris/effective_scale', 'r')
  local n = f and tonumber(f:read('*l')); if f then f:close() end
  return (n and n >= 0.4 and n <= 2.5) and n or 1
end
local function content_h()
  local f = io.open(os.getenv('HOME') .. '/.config/polaris/height', 'r')
  local n = f and tonumber(f:read('*l')); if f then f:close() end
  return (n and n >= 300) and n or 1250
end
local k = scale()

conky.config = {
  update_interval = rate(),
  own_window = true,
  own_window_type = 'normal',
  own_window_class = 'polaris',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_colour = '#00000000',
  double_buffer = true,
  alignment = sx and 'top_left' or 'top_right',
  gap_x = sx or 28, gap_y = sy or 56,
  minimum_width = math.floor(320 * k + 0.5), maximum_width = math.floor(320 * k + 0.5), minimum_height = math.floor(content_h() * k + 0.5),
  draw_shades = false, draw_outline = false, draw_borders = false,
  lua_load = (os.getenv('POLARIS_DIR') or '/usr/share/polaris') .. '/rings.lua',
  lua_draw_hook_pre = 'main',
};
